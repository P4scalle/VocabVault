<div class="space-y-6 pb-24 md:pb-8">
  <div class="flex items-center gap-3">
    <button type="button" class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" aria-label="Back" (click)="goBack()">
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
    </button>
    <div>
      <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">Smart Review</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">{{ dueCount() }} word{{ dueCount() !== 1 ? 's' : '' }} due for review</p>
    </div>
  </div>

  @if (dueCount() === 0) {
    <lib-empty-state
      iconClass="pi pi-check-circle"
      heading="All caught up!"
      body="No words are due for review right now. Keep practicing to build your schedule."
      actionLabel="Back to Home"
      (action)="goBack()"
    />
  } @else {
    <p class="text-sm text-slate-600 dark:text-slate-400">Choose a quiz mode to review your due words:</p>
    <div class="grid grid-cols-2 gap-2 xs:gap-3 md:grid-cols-4">
      @for (mode of quizModes; track mode.value) {
        <button type="button"
          class="flex flex-col items-center justify-center aspect-square md:aspect-auto md:py-10 vv-card p-3 xs:p-4 gap-2 vv-card-hover vv-btn-press vv-focus-ring disabled:opacity-40 disabled:pointer-events-none"
          [disabled]="mode.value === 'multiple-choice' && dueCount() < 4"
          [attr.title]="mode.value === 'multiple-choice' && dueCount() < 4 ? 'Needs at least 4 words' : null"
          (click)="startMode(mode.value)"
        >
          <span [class]="'rounded-xl p-3 ' + mode.colorClass">
            <i [class]="mode.iconClass + ' text-xl block'" aria-hidden="true"></i>
          </span>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300">{{ mode.label }}</span>
        </button>
      }
    </div>
  }
</div>
