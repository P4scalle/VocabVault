@if (rendered()) {
  <div [class]="shellClass()" [class.vv-action-drawer-shell--closing]="closing()">
    @if (resolvedConfig().modal) {
      <button
        type="button"
        class="vv-action-drawer__backdrop"
        aria-hidden="true"
        tabindex="-1"
        (click)="onBackdropClick()"
      ></button>
    }

    <aside
      #drawerPanel
      [id]="resolvedConfig().drawerId"
      [class]="mergedPanelClass()"
      [class.vv-action-drawer--closing]="closing()"
      [style]="resolvedConfig().panelStyle"
      role="dialog"
      tabindex="-1"
      [attr.aria-modal]="resolvedConfig().modal ? 'true' : null"
      [attr.aria-hidden]="visible() || closing() ? null : 'true'"
      [attr.aria-labelledby]="titleId()"
    >
      <header class="vv-action-drawer__header">
        <h2 [id]="titleId()" class="m-0 text-base font-semibold text-slate-900 dark:text-slate-100">
          {{ resolvedConfig().title }}
        </h2>
        @if (resolvedConfig().closable) {
          <button
            #closeButton
            type="button"
            class="vv-action-drawer__close-button"
            [attr.aria-label]="resolvedConfig().closeAriaLabel"
            (click)="closeDrawer()"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M8.01186 7.00933L12.27 2.75116C12.341 2.68501 12.398 2.60524 12.4375 2.51661C12.4769 2.42798 12.4982 2.3323 12.4999 2.23529C12.5016 2.13827 12.4838 2.0419 12.4474 1.95194C12.4111 1.86197 12.357 1.78024 12.2884 1.71163C12.2198 1.64302 12.138 1.58893 12.0481 1.55259C11.9581 1.51625 11.8617 1.4984 11.7647 1.50011C11.6677 1.50182 11.572 1.52306 11.4834 1.56255C11.3948 1.60204 11.315 1.65898 11.2488 1.72997L6.99067 5.98814L2.7325 1.72997C2.59553 1.60234 2.41437 1.53286 2.22718 1.53616C2.03999 1.53946 1.8614 1.61529 1.72901 1.74767C1.59663 1.88006 1.5208 2.05865 1.5175 2.24584C1.5142 2.43303 1.58368 2.61419 1.71131 2.75116L5.96948 7.00933L1.71131 11.2675C1.576 11.403 1.5 11.5866 1.5 11.7781C1.5 11.9696 1.576 12.1532 1.71131 12.2887C1.84679 12.424 2.03043 12.5 2.2219 12.5C2.41338 12.5 2.59702 12.424 2.7325 12.2887L6.99067 8.03052L11.2488 12.2887C11.3843 12.424 11.568 12.5 11.7594 12.5C11.9509 12.5 12.1346 12.424 12.27 12.2887C12.4053 12.1532 12.4813 11.9696 12.4813 11.7781C12.4813 11.5866 12.4053 11.403 12.27 11.2675L8.01186 7.00933Z"
                fill="currentColor"
              />
            </svg>
          </button>
        }
      </header>

      <section
        class="vv-action-drawer__content vv-action-drawer__actions"
        [attr.aria-label]="resolvedConfig().ariaLabel"
        [attr.aria-labelledby]="titleId()"
      >
        <ul role="list" class="m-0 flex list-none flex-col gap-2 p-0">
          @for (action of actions(); track action.id) {
            <li class="m-0 h-auto min-h-fit">
              @if (itemTemplate(); as templateRef) {
                <ng-container
                  [ngTemplateOutlet]="templateRef"
                  [ngTemplateOutletContext]="{
                    $implicit: action,
                    selectAction: selectAction,
                  }"
                />
              } @else {
                <button
                  #actionButton
                  type="button"
                  class="flex h-auto w-full items-start gap-3 rounded-xl border-0 bg-transparent px-3 py-3 text-left transition-colors hover:bg-vv-brand/10 vv-focus-ring-offset disabled:cursor-not-allowed disabled:opacity-50"
                  [class.vv-action-highlight]="action.highlight"
                  [disabled]="action.disabled ?? false"
                  (click)="onActionClick(action)"
                >
                  @if (action.iconClass) {
                    <i [class]="action.iconClass + ' mt-0.5 text-vv-brand'" aria-hidden="true"></i>
                  }
                  <div class="min-w-0 flex-1">
                    <p class="m-0 block whitespace-normal break-words text-sm font-semibold text-slate-900 dark:text-slate-100">
                      {{ action.label }}
                    </p>
                    @if (action.description) {
                      <p class="m-0 mt-0.5 block whitespace-normal break-words text-xs text-slate-500 dark:text-slate-400">
                        {{ action.description }}
                      </p>
                    }
                  </div>
                  @if (action.highlight) {
                    <span class="shrink-0 self-center rounded-full bg-vv-brand px-2 py-0.5 text-2xs font-semibold text-white">Start here</span>
                  }
                </button>
              }
            </li>
          }
        </ul>

        @if (footerNote()) {
          <p class="mt-3 flex items-start gap-1.5 px-1 text-xs text-slate-500 dark:text-slate-400" data-testid="action-drawer-footer">
            <i class="pi pi-info-circle mt-0.5 shrink-0 text-vv-brand" aria-hidden="true"></i>
            <span>{{ footerNote() }}</span>
          </p>
        }
      </section>
    </aside>
  </div>
}
