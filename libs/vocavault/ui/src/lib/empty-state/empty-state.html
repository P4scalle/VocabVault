<div class="flex flex-col items-center justify-center px-6 py-12 xs:py-16 text-center animate-fade-in-up">
  <div class="mb-4 flex h-14 w-14 xs:h-16 xs:w-16 md:h-20 md:w-20 items-center justify-center rounded-full bg-vv-brandLight dark:bg-vv-brand/20">
    <i [class]="iconClass() + ' text-xl xs:text-2xl md:text-3xl text-vv-brand'" aria-hidden="true"></i>
  </div>
  <h2 class="m-0 mb-2 text-base xs:text-lg font-semibold text-slate-900 dark:text-slate-100">{{ heading() }}</h2>
  @if (body()) {
    <p class="m-0 mb-6 max-w-xs text-sm text-slate-500 dark:text-slate-400">{{ body() }}</p>
  }
  @if (actionLabel()) {
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-xl bg-vv-brand px-5 py-3 text-sm font-medium text-white transition-colors hover:bg-vv-brand/90 vv-focus-ring-offset"
      (click)="action.emit()"
    >
      {{ actionLabel() }}
    </button>
  }
</div>
