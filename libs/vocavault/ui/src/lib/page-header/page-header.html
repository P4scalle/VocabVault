<header class="flex items-center gap-3 py-4">
  @if (showBack()) {
    <button
      type="button"
      class="vv-icon-btn text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-vv-brand vv-focus-ring transition-all duration-300"
      [class.vv-back-hint]="backHint.pulse()"
      aria-label="Go back"
      (click)="backClicked.emit()"
    >
      <i class="pi pi-arrow-left text-sm" aria-hidden="true"></i>
    </button>
  }
  <h1 class="m-0 text-lg xs:text-xl font-bold leading-tight text-slate-900 dark:text-slate-100">{{ title() }}</h1>
</header>
